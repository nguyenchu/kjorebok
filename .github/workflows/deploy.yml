name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Hva vil du deploye?"
        required: true
        default: both
        type: choice
        options:
          - both
          - app
          - android
          - portfolio-inspect
          - portfolio

      portfolio_ref:
        description: "Validated commit in nguyenchu/nguyenchu for portfolio deployment"
        type: string
        required: false
        default: main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy_app:
    name: Deploy web and api
    if: github.event.inputs.target == 'both' || github.event.inputs.target == 'app'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @kjorebok/api exec prisma generate

      - name: Build
        run: pnpm build

      - name: Start SSH agent
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
          {
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID"
          } >> "$GITHUB_ENV"

      - name: Add server host key
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "Missing required secret: DEPLOY_HOST" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          touch ~/.ssh/known_hosts
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: >
          ssh "$DEPLOY_USER@$DEPLOY_HOST"
          "cd '$DEPLOY_PATH' &&
          git fetch origin main &&
          git checkout main &&
          bash deploy/deploy.sh"

  publish_android:
    name: Build and publish Android APK
    if: github.event.inputs.target == 'both' || github.event.inputs.target == 'android'
    runs-on: [self-hosted, macOS, ARM64, mac-mini]
    environment: production

    env:
      EXPO_PUBLIC_API_URL: https://kjorebok.nguyenchu.com/api
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_DOWNLOAD_DIR: /var/www/kjorebok-downloads

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute Android version
        working-directory: apps/mobile
        run: |
          node <<'EOF'
          const fs = require("fs");

          const appConfig = JSON.parse(fs.readFileSync("app.json", "utf8"));
          const configuredVersion = appConfig.expo.version;
          const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(configuredVersion);

          if (!match) {
            throw new Error(`Expected expo.version to be semver, got: ${configuredVersion}`);
          }

          const versionCode = process.env.GITHUB_RUN_NUMBER;
          const appVersion = configuredVersion;

          fs.writeFileSync(
            process.env.GITHUB_ENV,
            `APP_VERSION=${appVersion}\nANDROID_VERSION_CODE=${versionCode}\n`,
            { flag: "a" }
          );
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease

      - name: Prepare Android metadata
        run: |
          cat > android-latest.json <<EOF
          {
            "version": "${APP_VERSION}",
            "versionCode": ${ANDROID_VERSION_CODE},
            "publishedAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            android-latest.json
          if-no-files-found: error

      - name: Start SSH agent
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
          {
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID"
          } >> "$GITHUB_ENV"

      - name: Add server host key
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "Missing required secret: DEPLOY_HOST" >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          touch ~/.ssh/known_hosts
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/known_hosts

      - name: Publish APK to server
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "test -w '$DEPLOY_DOWNLOAD_DIR'"
          scp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DOWNLOAD_DIR/android.apk"
          scp android-latest.json "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DOWNLOAD_DIR/android-latest.json"

  portfolio:
    name: Inspect or deploy personal portfolio
    if: github.event.inputs.target == 'portfolio-inspect' || github.event.inputs.target == 'portfolio'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - name: Start SSH agent
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
      - name: Add server host key
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/known_hosts
      - name: Inspect public website configuration
        if: github.event.inputs.target == 'portfolio-inspect'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'python3 -' <<'PYTHON'
          from pathlib import Path
          import re
          for p in Path('/etc/nginx/sites-enabled').iterdir():
              text = p.read_text()
              if re.search(r'server_name\s+(?:www\.)?nguyenchu\.com(?:\s|;)', text):
                  print('CONFIG:', p.resolve())
                  for line in text.splitlines():
                      if re.match(r'\s*(server_name|root|index|location|try_files)\b', line):
                          print(line.strip())
          PYTHON
      - name: Check out portfolio source
        if: github.event.inputs.target == 'portfolio'
        uses: actions/checkout@v6
        with:
          repository: nguyenchu/nguyenchu
          ref: ${{ inputs.portfolio_ref }}
          path: portfolio-source
      - name: Upload portfolio files
        if: github.event.inputs.target == 'portfolio'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          REMOTE_STAGE=$(ssh "$DEPLOY_USER@$DEPLOY_HOST" 'mktemp -d /tmp/portfolio-deploy.XXXXXXXX')
          echo "REMOTE_STAGE=$REMOTE_STAGE" >> "$GITHUB_ENV"
          scp -r portfolio-source/site "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_STAGE/site"
      - name: Publish portfolio with backup
        if: github.event.inputs.target == 'portfolio'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$REMOTE_STAGE" "${{ github.run_id }}" <<'REMOTE'
          set -euo pipefail
          STAGE="$1/site"
          ROOT=/var/www/html
          BACKUP="$HOME/portfolio-backups/$2"
          python3 - <<'PYTHON'
          from pathlib import Path
          import re
          config = Path('/etc/nginx/sites-available/nguyenchu.com').read_text()
          assert re.search(r'root\s+/var/www/html\s*;', config), 'Unexpected document root'
          assert re.search(r'server_name\s+nguyenchu\.com(?:\s|;)', config), 'Unexpected host'
          PYTHON
          test -f "$ROOT/index.html"
          mkdir -p "$BACKUP/prosjekter" "$BACKUP/images"
          chmod 700 "$HOME/portfolio-backups" "$BACKUP"
          for file in index.html styles.css favicon.svg prosjekter/kjorebok.html prosjekter/matkupp.html images/kjorebok-demo.png; do
            if [ -f "$ROOT/$file" ]; then cp "$ROOT/$file" "$BACKUP/$file"; fi
          done
          sudo -n /usr/bin/mkdir -p "$ROOT/prosjekter" "$ROOT/images"
          for file in styles.css favicon.svg images/kjorebok-demo.png prosjekter/kjorebok.html prosjekter/matkupp.html index.html; do
            sudo -n /usr/bin/cp "$STAGE/$file" "$ROOT/$file"
          done
          curl -fsS https://nguyenchu.com/ | grep -q 'mobil- og frontendutvikler'
          curl -fsS https://nguyenchu.com/prosjekter/kjorebok.html | grep -q 'GPS-punkter'
          echo "Portfolio deployed. Previous files backed up in $BACKUP"
          REMOTE
